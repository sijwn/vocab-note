<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>단어장 웹 뷰어</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, "Noto Sans KR", sans-serif; margin: 18px; }
    .card { max-width: 980px; margin: 0 auto; padding: 16px; border: 1px solid #ddd; border-radius: 14px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0; }
    label { font-size: 14px; }
    input[type="number"] { width: 110px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 15px; }
    button { padding: 10px 14px; border: 0; border-radius: 12px; cursor: pointer; font-size: 14px; }
    button.primary { background:#111; color:#fff; }
    button.secondary { background:#eee; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .pill { display:inline-block; padding: 6px 10px; border:1px solid #ddd; border-radius:999px; font-size:12px; color:#444; background:#fff; }
    .log { white-space: pre-wrap; background:#fafafa; border:1px solid #eee; border-radius: 12px; padding: 12px; font-size: 13px; }
    .bad { color:#b00020; }
    .good { color:#0a7a3a; }

    .setupTitle { margin:0 0 6px; }
    .muted { color:#666; font-size: 13px; }

    /* ===== 큰 이전/다음 버튼을 단어 박스 좌/우에 붙이기 ===== */
    .wordStage {
      position: relative;
      margin-top: 6px;
    }
    
    .sideNav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 72%;
      min-height: 140px;
      border-radius: 16px;
      border: 1px solid #eee;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    
    .sideNav.left { left: 10px; }
    .sideNav.right { right: 10px; }
    
    .sideNav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    
    /* 단어 박스가 버튼에 가리지 않도록 좌우 패딩 늘리기 */
    .wordBox {
      padding-left: 78px;
      padding-right: 78px;
    }

    /* 텍스트가 버튼 아래로 깔리지 않게 '안전영역'을 강제로 좁힘 */
    .textSafe{
      width: calc(100% - 160px); /* 좌/우 버튼 영역 제외 (기본값) */
      margin: 0 auto;
      text-align: center;
    }




    /* ===== Viewer ===== */
    .viewerWrap { display:none; margin-top: 6px; }
    .viewerTop {
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .counter { font-size: 13px; color:#555; }

    .topBtns { display:flex; gap: 8px; flex-wrap: wrap; align-items:center; justify-content:flex-end; }
    .tagOn { background:#111 !important; color:#fff !important; }

    .wordBox {
      border: 1px solid #f0f0f0;
      border-radius: 18px;
      padding: 30px 18px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
      user-select: none;
      cursor: pointer;
      min-height: 170px;
      display:flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .word { font-size: 24px; font-weight: 800; letter-spacing: 0.2px; }
    .meaning { font-size: 16px; color:#222; line-height: 1.4; }

    .navBtns {
      display:flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ✅ 버튼을 작게(모바일 한 줄 목표) */
    .navBtns button {
      padding: 10px 10px;
      border-radius: 12px;
      font-weight: 600;
      min-width: 0;
    }

    /* 모바일에서는 더 작게 */
    @media (max-width: 520px) {
      .navBtns { gap: 6px; }
      .navBtns button { padding: 9px 9px; font-size: 13px; }
      .word { font-size: 20px; }
      .meaning { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- ===== SETUP VIEW ===== -->
    <div class="setupWrap" id="setupWrap">
      <h2 class="setupTitle">단어장 웹 뷰어</h2>
      <div class="muted">엑셀 형식: (A=day, B=단어, C=뜻) / 시트 우선순위: <b>단어장</b> → <b>Sheet1</b> → 첫 시트</div>

      <div class="row" style="margin-top:14px;">
        <button class="secondary" id="pickBtn">엑셀 파일 불러오기</button>
        <button class="secondary" id="prevFileBtn" disabled>이전 파일 불러오기</button>
      </div>

      <div class="row">
        <span class="pill" id="fileLabel">파일: (선택 안 됨)</span>
        <span class="pill" id="sheetLabel">시트: -</span>
        <span class="pill" id="countLabel">단어: -</span>
      </div>

      <!-- ✅ 모바일에서 .xlsm 선택 이슈 피하려고 accept 제거 -->
      <input id="fileInput" type="file" style="display:none" />

      <div class="row" style="margin-top:8px;">
        <label>Day 범위:</label>
        <input id="dayStart" type="number" min="0" value="1" />
        <span>~</span>
        <input id="dayEnd" type="number" min="0" value="1" />
        <button class="primary" id="startBtn" disabled>시작</button>
      </div>

      <div id="status" class="log" style="margin-top:12px;">대기 중…</div>
    </div>

    <!-- ===== VIEWER VIEW ===== -->
    <div class="viewerWrap" id="viewerWrap">
      <div class="viewerTop">
        <div class="counter" id="counter">-</div>
        <div class="topBtns">
          <button class="secondary" id="shuffleBtn">랜덤: OFF</button>
          <button class="secondary" id="reselectBtn">범위 다시 선택</button>
        </div>
      </div>

      <div class="wordStage">
        <button class="sideNav left" id="sidePrev" title="이전">&lt;</button>
      
        <div class="wordBox" id="wordBox" role="button" tabindex="0" aria-label="단어/뜻 토글">
          <div class="textSafe">
            <div class="word" id="wordText">-</div>
            <div class="meaning" id="meanText" style="display:none;">-</div>
          </div>
        </div>

      
        <button class="sideNav right" id="sideNext" title="다음">&gt;</button>
      </div>


      <div class="navBtns" id="navBtns">
        <button class="secondary" id="firstBtn" title="처음">&lt;&lt;</button>
        <button class="secondary" id="prevDayBtn" title="이전 Day">|&lt;</button>

        <button class="secondary" id="prevBtn" title="이전">&lt;</button>
        <button class="secondary" id="nextBtn" title="다음">&gt;</button>

        <button class="secondary" id="nextDayBtn" title="다음 Day">&gt;|</button>
        <button class="secondary" id="lastBtn" title="끝">&gt;&gt;</button>
      </div>
    </div>
  </div>

  <script src="./xlsx.full.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    const setupWrap = $("setupWrap");
    const viewerWrap = $("viewerWrap");
    const statusEl = $("status");

    // Data
    let allRows = [];
    let inRange = [];
    let daysInRange = [];

    // Sequential
    let seqIndex = 0;

    // Random (no-duplicate order)
    let randomOn = false;
    let randomOrder = [];
    let randomPos = 0;

    // meaning toggle
    let meaningShown = false;

    // FS Access
    let currentHandle = null;

    function log(msg, cls="") {
      statusEl.textContent = msg;
      statusEl.className = "log " + cls;
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function toInt(x) {
      const n = Number(x);
      if (!Number.isFinite(n)) return null;
      return Math.trunc(n);
    }
    function supportsFSAccess() {
      return !!window.showOpenFilePicker;
    }
    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function pickSheetName(wb) {
      const names = wb.SheetNames || [];
      const norm = (s) => (s ?? "").toString().replace(/\s+/g, "").trim();
      const findBy = (target) => names.find(n => norm(n) === norm(target));
      return findBy("단어장") || findBy("Sheet1") || names[0];
    }

    function parseFlexibleDayWordMean(data2d) {
      const norm = (v) => (v ?? "").toString().trim();
      const isInt = (v) => /^\d+$/.test(norm(v));
      const looksEnglish = (v) => /[A-Za-z]/.test(norm(v)) && !/[가-힣]/.test(norm(v));
      const looksKorean  = (v) => /[가-힣]/.test(norm(v));

      const rowCount = data2d.length;
      const colCount = Math.max(0, ...data2d.map(r => (r ? r.length : 0)));

      const scores = Array.from({ length: colCount }, () => ({ nonEmpty:0, day:0, eng:0, kor:0 }));
      for (let r = 0; r < rowCount; r++) {
        const row = data2d[r] || [];
        for (let c = 0; c < colCount; c++) {
          const v = row[c];
          const s = norm(v);
          if (!s) continue;
          scores[c].nonEmpty++;
          if (isInt(s)) scores[c].day++;
          if (looksEnglish(s)) scores[c].eng++;
          if (looksKorean(s)) scores[c].kor++;
        }
      }

      const ratio = (num, den) => den ? num / den : 0;

      let dayCol = -1, bestDay = 0;
      for (let c = 0; c < colCount; c++) {
        const nonEmpty = scores[c].nonEmpty;
        if (nonEmpty < 5) continue;
        const dayR = ratio(scores[c].day, nonEmpty);
        if (dayR > bestDay) { bestDay = dayR; dayCol = c; }
      }
      if (dayCol === -1 || bestDay < 0.7) return { rows: [] };

      let wordCol = -1, bestEng = 0;
      let meanCol = -1, bestKor = 0;
      for (let c = 0; c < colCount; c++) {
        if (c === dayCol) continue;
        const nonEmpty = scores[c].nonEmpty;
        if (nonEmpty < 5) continue;

        const engR = ratio(scores[c].eng, nonEmpty);
        const korR = ratio(scores[c].kor, nonEmpty);

        if (engR > bestEng) { bestEng = engR; wordCol = c; }
        if (korR > bestKor) { bestKor = korR; meanCol = c; }
      }
      if (wordCol === -1 || meanCol === -1) return { rows: [] };

      const rows = [];
      for (let r = 0; r < rowCount; r++) {
        const row = data2d[r] || [];
        const day = row[dayCol];
        if (!/^\d+$/.test(norm(day))) continue;
        const d = Number(norm(day));
        const w = norm(row[wordCol]);
        const m = norm(row[meanCol]);
        if (!w) continue;
        rows.push({ day: d, word: w, mean: m });
      }
      return { rows };
    }

    async function readExcelFromFile(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheetName = pickSheetName(wb);
      const ws = wb.Sheets[sheetName];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });

      const fixed = [];
      for (const r of data) {
        if (!r || r.length < 2) continue;
        const day = toInt(r[0]);
        const word = (r[1] ?? "").toString().trim();
        const mean = (r[2] ?? "").toString().trim();
        if (day === null) continue;
        if (!word) continue;
        fixed.push({ day, word, mean });
      }
      if (fixed.length >= 10) return { rows: fixed, sheetName };

      const auto = parseFlexibleDayWordMean(data);
      if (auto.rows.length >= 10) return { rows: auto.rows, sheetName };

      return { rows: fixed, sheetName };
    }

    async function readExcelFromSource() {
      if (currentHandle) {
        const file = await currentHandle.getFile();
        const parsed = await readExcelFromFile(file);
        return { ...parsed, shownName: currentHandle.name };
      }
      const f = $("fileInput").files?.[0];
      if (!f) throw new Error("먼저 엑셀 파일을 선택해 주세요.");
      const parsed = await readExcelFromFile(f);
      return { ...parsed, shownName: f.name };
    }

    function computeMinMaxDay(rows) {
      let min = Infinity, max = -Infinity;
      for (const r of rows) {
        min = Math.min(min, r.day);
        max = Math.max(max, r.day);
      }
      if (!Number.isFinite(min) || !Number.isFinite(max)) return null;
      return { min, max };
    }

    function buildDaysInRange() {
      daysInRange = Array.from(new Set(inRange.map(r => r.day))).sort((a,b)=>a-b);
    }

    function buildRandomOrder() {
      randomOrder = Array.from({ length: inRange.length }, (_, i) => i);
      shuffleInPlace(randomOrder);
      randomPos = 0;
    }

    function currentItem() {
      if (!inRange.length) return null;
      if (randomOn) {
        const idx = randomOrder[randomPos] ?? randomOrder[0];
        return inRange[idx];
      }
      return inRange[seqIndex];
    }

    function setNavMode() {
      const showExtra = !randomOn;
      $("firstBtn").style.display = showExtra ? "" : "none";
      $("lastBtn").style.display  = showExtra ? "" : "none";
      $("prevDayBtn").style.display = showExtra ? "" : "none";
      $("nextDayBtn").style.display = showExtra ? "" : "none";
      $("prevBtn").style.display = "";
      $("nextBtn").style.display = "";
    }

    function updateShuffleBtn() {
      const btn = $("shuffleBtn");
      btn.textContent = randomOn ? "랜덤: ON" : "랜덤: OFF";
      btn.classList.toggle("tagOn", randomOn);
    }

    function render() {
      updateShuffleBtn();
      setNavMode();

      const item = currentItem();
      if (!item) return;

      $("wordText").textContent = item.word || "-";
      $("meanText").textContent = item.mean || "";
      $("meanText").style.display = meaningShown ? "block" : "none";

      if (randomOn) {
        $("counter").textContent = `${randomPos + 1} / ${inRange.length}`;
      } else {
        $("counter").textContent = `Day ${item.day} · ${seqIndex + 1} / ${inRange.length}`;
      }

      $("prevBtn").disabled = randomOn ? (randomPos === 0) : (seqIndex === 0);
      $("nextBtn").disabled = randomOn ? (randomPos >= inRange.length - 1) : (seqIndex >= inRange.length - 1);

      if (!randomOn) {
        $("firstBtn").disabled = (seqIndex === 0);
        $("lastBtn").disabled  = (seqIndex >= inRange.length - 1);

        const di = daysInRange.indexOf(item.day);
        $("prevDayBtn").disabled = (di <= 0);
        $("nextDayBtn").disabled = (di === -1 || di >= daysInRange.length - 1);
      }
    }

    function goNext() {
      if (!inRange.length) return;
      meaningShown = false;
      if (randomOn) {
        if (randomPos < inRange.length - 1) randomPos++;
      } else {
        if (seqIndex < inRange.length - 1) seqIndex++;
      }
      render();
    }
    function goPrev() {
      if (!inRange.length) return;
      meaningShown = false;
      if (randomOn) {
        if (randomPos > 0) randomPos--;
      } else {
        if (seqIndex > 0) seqIndex--;
      }
      render();
    }

    function goFirst() { meaningShown = false; seqIndex = 0; render(); }
    function goLast()  { meaningShown = false; seqIndex = inRange.length - 1; render(); }

    function goDay(targetDay) {
      const idx = inRange.findIndex(r => r.day === targetDay);
      if (idx >= 0) { meaningShown = false; seqIndex = idx; render(); }
    }
    function goPrevDay() {
      const item = currentItem(); if (!item) return;
      const di = daysInRange.indexOf(item.day);
      if (di > 0) goDay(daysInRange[di - 1]);
    }
    function goNextDay() {
      const item = currentItem(); if (!item) return;
      const di = daysInRange.indexOf(item.day);
      if (di >= 0 && di < daysInRange.length - 1) goDay(daysInRange[di + 1]);
    }

    function toggleMeaning() {
      meaningShown = !meaningShown;
      render();
    }

    function applyRangeAndEnterViewer() {
      const s = toInt($("dayStart").value);
      const e = toInt($("dayEnd").value);
      assert(s !== null && e !== null, "Day 값이 올바르지 않습니다.");
      assert(e >= s, "Day 끝값이 시작값보다 작습니다.");

      inRange = allRows.filter(r => r.day >= s && r.day <= e).sort((a,b)=>a.day-b.day);
      assert(inRange.length > 0, "해당 Day 범위에 단어가 없습니다.");

      buildDaysInRange();

      seqIndex = 0;
      meaningShown = false;
      randomOn = false;

      buildRandomOrder();

      setupWrap.style.display = "none";
      viewerWrap.style.display = "block";
      render();
    }

    function enterSetupMode() {
      viewerWrap.style.display = "none";
      setupWrap.style.display = "block";
      log("Day 범위를 다시 지정하세요.", "good");
    }

    // ===== IndexedDB for previous file =====
    const IDB_DB = "vocab_note_app";
    const IDB_STORE = "kv";
    const KEY_HANDLE = "last_excel_handle";

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSet(key, value) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function saveLastHandle(handle) {
      await idbSet(KEY_HANDLE, handle);
    }
    async function loadLastHandle() { return await idbGet(KEY_HANDLE); }

    async function ensurePrevButtonState() {
      if (!supportsFSAccess()) {
        // 모바일은 대부분 FS Access 미지원 → 버튼을 "다시 선택" 용도로 살려도 됨
        $("prevFileBtn").disabled = false;
        $("prevFileBtn").textContent = "이전 파일(다시 선택)";
        return;
      }
      try {
        const h = await loadLastHandle();
        $("prevFileBtn").disabled = !h;
      } catch {
        $("prevFileBtn").disabled = true;
      }
    }

    async function requestHandlePermission(handle) {
      // ✅ 권한 팝업이 가능한 환경이면 여기서 뜸
      let perm = await handle.queryPermission({ mode: "read" });
      if (perm !== "granted") {
        perm = await handle.requestPermission({ mode: "read" });
      }
      assert(perm === "granted", "파일 접근 권한이 필요합니다. 권한을 허용해 주세요.");
    }

    // ===== File pick =====
    async function pickExcelAuto() {
      if (supportsFSAccess()) {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: "Excel 파일",
            accept: {
              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"],
              "application/vnd.ms-excel": [".xls"],
              "application/vnd.ms-excel.sheet.macroEnabled.12": [".xlsm"],
            }
          }],
        });
        assert(handle, "파일을 선택하지 않았습니다.");
        await requestHandlePermission(handle);
        currentHandle = handle;
        await saveLastHandle(handle);
        $("prevFileBtn").disabled = false;
        return;
      }

      // FS Access 미지원(모바일): input으로 선택
      await new Promise((resolve, reject) => {
        const input = $("fileInput");
        input.value = "";
        input.onchange = () => {
          const f = input.files?.[0];
          if (!f) reject(new Error("파일을 선택하지 않았습니다."));
          else resolve();
        };
        input.click();
      });
    }

    async function usePreviousFileOrFallbackPick() {
      if (!supportsFSAccess()) {
        // ✅ 모바일: "이전 파일"이라는 개념이 불가능하니, 다시 선택하도록 폴백
        await new Promise((resolve, reject) => {
          const input = $("fileInput");
          input.value = "";
          input.onchange = () => {
            const f = input.files?.[0];
            if (!f) reject(new Error("파일을 선택하지 않았습니다."));
            else resolve();
          };
          input.click();
        });
        return;
      }

      const handle = await loadLastHandle();
      assert(handle, "저장된 이전 파일이 없습니다.");
      await requestHandlePermission(handle); // ✅ 여기서 권한 알림(가능한 브라우저)
      currentHandle = handle;
    }

    async function loadExcelAndEnableStart() {
      log("엑셀 읽는 중…");
      const { shownName, sheetName, rows } = await readExcelFromSource();
      assert(rows.length > 0, "유효한 데이터(day/단어/뜻)를 찾지 못했습니다.");

      allRows = rows;
      $("fileLabel").textContent = `파일: ${shownName}`;
      $("sheetLabel").textContent = `시트: ${sheetName}`;
      $("countLabel").textContent = `단어: ${allRows.length}개`;

      const mm = computeMinMaxDay(allRows);
      assert(mm, "Day 값을 찾지 못했습니다.");
      $("dayStart").value = mm.min;
      $("dayEnd").value = mm.max;

      $("startBtn").disabled = false;

      log(
        `파일: ${shownName}\n시트: ${sheetName}\n총 단어: ${allRows.length}개\nDay 범위를 정하고 '시작'을 누르세요.`,
        "good"
      );
    }

    // ===== Events =====
    $("sidePrev").addEventListener("click", goPrev);
    $("sideNext").addEventListener("click", goNext);

    $("pickBtn").addEventListener("click", async () => {
      try {
        $("startBtn").disabled = true;
        await pickExcelAuto();
        await loadExcelAndEnableStart();
      } catch (e) {
        console.error(e);
        log(e.message || String(e), "bad");
      }
    });

    $("prevFileBtn").addEventListener("click", async () => {
      try {
        $("startBtn").disabled = true;
        await usePreviousFileOrFallbackPick();
        await loadExcelAndEnableStart();
      } catch (e) {
        console.error(e);
        log(e.message || String(e), "bad");
      }
    });

    $("startBtn").addEventListener("click", () => {
      try { applyRangeAndEnterViewer(); }
      catch (e) { log(e.message || String(e), "bad"); }
    });

    $("reselectBtn").addEventListener("click", enterSetupMode);

    $("shuffleBtn").addEventListener("click", () => {
      if (!inRange.length) return;
      randomOn = !randomOn;
      meaningShown = false;

      if (randomOn) {
        buildRandomOrder();
      } else {
        const cur = currentItem();
        const idx = inRange.findIndex(r => r.day === cur.day && r.word === cur.word && r.mean === cur.mean);
        if (idx >= 0) seqIndex = idx;
      }
      render();
    });

    $("prevBtn").addEventListener("click", goPrev);
    $("nextBtn").addEventListener("click", goNext);

    $("firstBtn").addEventListener("click", goFirst);
    $("lastBtn").addEventListener("click", goLast);
    $("prevDayBtn").addEventListener("click", () => { if (!randomOn) goPrevDay(); });
    $("nextDayBtn").addEventListener("click", () => { if (!randomOn) goNextDay(); });

    $("wordBox").addEventListener("click", toggleMeaning);
    $("wordBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleMeaning();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (viewerWrap.style.display === "none") return;
      if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
      if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    });

    (async () => {
      await ensurePrevButtonState();
      log("대기 중…");
    })();
  </script>
</body>
</html>
