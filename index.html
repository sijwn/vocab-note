<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>단어장 뷰어</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, "Noto Sans KR", sans-serif; margin: 18px; }
    .card { max-width: 980px; margin: 0 auto; padding: 16px; border: 1px solid #ddd; border-radius: 14px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin: 10px 0; }
    label { font-size: 14px; }
    input[type="number"] { width: 110px; padding: 8px; border: 1px solid #ccc; border-radius: 10px; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; }
    button.primary { background:#111; color:#fff; }
    button.secondary { background:#eee; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .pill { display:inline-block; padding: 4px 10px; border:1px solid #ddd; border-radius:999px; font-size:12px; color:#444; background:#fff; }
    .log { white-space: pre-wrap; background:#fafafa; border:1px solid #eee; border-radius: 12px; padding: 12px; font-size: 13px; }
    .bad { color:#b00020; }
    .good { color:#0a7a3a; }

    .viewer {
      margin-top: 14px;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .dayPickerWrap {
      display:flex;
      align-items:center;
      gap: 8px;
    }

    select {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
      max-height: 260px;
    }

    .counter { font-size: 13px; color:#555; }

    .wordBox {
      margin-top: 8px;
      border: 1px solid #f0f0f0;
      border-radius: 16px;
      padding: 26px 18px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
      user-select: none;
      cursor: pointer;
    }

    .word { font-size: 34px; font-weight: 750; letter-spacing: 0.2px; }
    .meaning { margin-top: 14px; font-size: 22px; color:#222; line-height: 1.4; }
    .hint { margin-top: 10px; font-size: 13px; color:#777; }

    .controls {
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }

    .smallBtn { padding: 10px 12px; border-radius: 12px; background:#eee; }
    .smallBtn.primary { background:#111; color:#fff; }

    .muted { color:#666; font-size: 13px; }

    .tagOn { background:#111 !important; color:#fff !important; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px;">단어장 웹 뷰어</h2>
    <div class="muted">엑셀 형식: (A=day, B=단어, C=뜻) / 시트 우선순위: <b>단어장</b> → <b>Sheet1</b> → 첫 시트</div>

    <div class="row" style="margin-top:14px;">
      <button class="secondary" id="pickBtn">엑셀 파일 불러오기</button>
      <span class="pill" id="fileLabel">파일: (선택 안 됨)</span>
      <span class="pill" id="sheetLabel">시트: -</span>
      <span class="pill" id="countLabel">단어: -</span>
    </div>

    <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" style="display:none" />

    <div class="row">
      <label>Day 범위:</label>
      <input id="dayStart" type="number" min="0" value="1" />
      <span>~</span>
      <input id="dayEnd" type="number" min="0" value="1" />
      <button class="secondary" id="applyBtn" disabled>범위 적용</button>
      <button class="secondary" id="shuffleBtn" disabled>랜덤: OFF</button>
      <span class="pill" id="rangeInfo">범위: -</span>
    </div>

    <div id="status" class="log" style="margin-top:12px;">대기 중…</div>

    <div class="viewer" id="viewer" style="display:none;">
      <div class="topbar">
        <div class="counter" id="counter">-</div>

        <div class="dayPickerWrap">
          <span class="pill">DAY</span>
          <select id="daySelect" disabled></select>
        </div>
      </div>

      <div class="wordBox" id="wordBox" role="button" tabindex="0" aria-label="단어/뜻 토글">
        <div class="word" id="wordText">-</div>
        <div class="meaning" id="meanText" style="display:none;">-</div>
        <div class="hint" id="hintText">박스를 누르면 뜻이 나타납니다</div>
      </div>

      <div class="controls">
        <button class="smallBtn" id="firstBtn" disabled>처음으로</button>
        <button class="smallBtn" id="prevBtn" disabled>이전</button>

        <button class="smallBtn primary" id="toggleBtn" disabled>뜻 보기</button>

        <button class="smallBtn" id="nextBtn" disabled>다음</button>
        <button class="smallBtn" id="lastBtn" disabled>끝으로</button>
      </div>

      <div class="controls">
        <button class="smallBtn" id="prevDayBtn" disabled>이전 Day</button>
        <button class="smallBtn" id="nextDayBtn" disabled>다음 Day</button>
      </div>
    </div>
  </div>

  <script src="./xlsx.full.min.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    const statusEl = $("status");
    const viewerEl = $("viewer");

    let currentFile = null;
    let allRows = [];        // 전체 {day, word, mean}
    let inRange = [];        // 범위 내 원본(정렬된) rows
    let deck = [];           // 실제 표시용(랜덤/정렬 적용된) rows
    let daysInRange = [];    // 범위 내 day 목록(정렬)
    let currentIndex = 0;
    let meaningShown = false;
    let shuffleOn = false;

    function log(msg, cls="") {
      statusEl.textContent = msg;
      statusEl.className = "log " + cls;
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    function toInt(x) {
      const n = Number(x);
      if (!Number.isFinite(n)) return null;
      return Math.trunc(n);
    }

    function supportsFSAccess() {
      return !!window.showOpenFilePicker;
    }

    function stableKey(r) {
      // 같은 단어를 유지하기 위한 키(가능한 유니크하게)
      return `${r.day}||${r.word}||${r.mean}`;
    }

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // ===== 시트 선택: 단어장 -> Sheet1 -> 첫 시트 =====
    function pickSheetName(wb) {
      const names = wb.SheetNames || [];
      const norm = (s) => (s ?? "").toString().replace(/\s+/g, "").trim();
      const findBy = (target) => names.find(n => norm(n) === norm(target));
      return findBy("단어장") || findBy("Sheet1") || names[0];
    }

    // ===== 자동 컬럼 추론 fallback =====
    function parseFlexibleDayWordMean(data2d) {
      const norm = (v) => (v ?? "").toString().trim();
      const isInt = (v) => /^\d+$/.test(norm(v));
      const looksEnglish = (v) => /[A-Za-z]/.test(norm(v)) && !/[가-힣]/.test(norm(v));
      const looksKorean  = (v) => /[가-힣]/.test(norm(v));

      const rowCount = data2d.length;
      const colCount = Math.max(0, ...data2d.map(r => (r ? r.length : 0)));

      const scores = Array.from({ length: colCount }, () => ({ nonEmpty:0, day:0, eng:0, kor:0 }));

      for (let r = 0; r < rowCount; r++) {
        const row = data2d[r] || [];
        for (let c = 0; c < colCount; c++) {
          const v = row[c];
          const s = norm(v);
          if (!s) continue;
          scores[c].nonEmpty++;
          if (isInt(s)) scores[c].day++;
          if (looksEnglish(s)) scores[c].eng++;
          if (looksKorean(s)) scores[c].kor++;
        }
      }

      const ratio = (num, den) => den ? num / den : 0;

      let dayCol = -1, bestDay = 0;
      for (let c = 0; c < colCount; c++) {
        const nonEmpty = scores[c].nonEmpty;
        if (nonEmpty < 5) continue;
        const dayR = ratio(scores[c].day, nonEmpty);
        if (dayR > bestDay) { bestDay = dayR; dayCol = c; }
      }
      if (dayCol === -1 || bestDay < 0.7) return { rows: [] };

      let wordCol = -1, bestEng = 0;
      let meanCol = -1, bestKor = 0;
      for (let c = 0; c < colCount; c++) {
        if (c === dayCol) continue;
        const nonEmpty = scores[c].nonEmpty;
        if (nonEmpty < 5) continue;

        const engR = ratio(scores[c].eng, nonEmpty);
        const korR = ratio(scores[c].kor, nonEmpty);

        if (engR > bestEng) { bestEng = engR; wordCol = c; }
        if (korR > bestKor) { bestKor = korR; meanCol = c; }
      }
      if (wordCol === -1 || meanCol === -1) return { rows: [] };

      const rows = [];
      for (let r = 0; r < rowCount; r++) {
        const row = data2d[r] || [];
        const day = row[dayCol];
        if (!isInt(day)) continue;
        const d = Number(norm(day));
        const w = norm(row[wordCol]);
        const m = norm(row[meanCol]);
        if (!w) continue;
        rows.push({ day: d, word: w, mean: m });
      }

      return { rows };
    }

    // ===== 엑셀 읽기 =====
    async function readExcel(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });

      const sheetName = pickSheetName(wb);
      const ws = wb.Sheets[sheetName];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });

      // 1) 고정 파싱(A,B,C)
      const fixed = [];
      for (const r of data) {
        if (!r || r.length < 2) continue;
        const day = toInt(r[0]);
        const word = (r[1] ?? "").toString().trim();
        const mean = (r[2] ?? "").toString().trim();
        if (day === null) continue;
        if (!word) continue;
        fixed.push({ day, word, mean });
      }

      if (fixed.length >= 10) return { rows: fixed, sheetName };

      // 2) fallback
      const auto = parseFlexibleDayWordMean(data);
      if (auto.rows.length >= 10) return { rows: auto.rows, sheetName };

      return { rows: fixed, sheetName };
    }

    function computeMinMaxDay(rows) {
      let min = Infinity, max = -Infinity;
      for (const r of rows) {
        if (typeof r.day !== "number") continue;
        min = Math.min(min, r.day);
        max = Math.max(max, r.day);
      }
      if (!Number.isFinite(min) || !Number.isFinite(max)) return null;
      return { min, max };
    }

    function rebuildDeck(keepKey = null) {
      // inRange(원본)에서 deck(표시용) 재구성
      deck = inRange.slice();
      if (shuffleOn) shuffleInPlace(deck);

      // keepKey가 있으면 그 단어를 찾아 인덱스 유지
      if (keepKey) {
        const idx = deck.findIndex(r => stableKey(r) === keepKey);
        if (idx >= 0) currentIndex = idx;
        else currentIndex = Math.min(currentIndex, deck.length - 1);
      } else {
        currentIndex = Math.min(currentIndex, deck.length - 1);
      }
    }

    function applyRange() {
      const s = toInt($("dayStart").value);
      const e = toInt($("dayEnd").value);
      assert(s !== null && e !== null, "Day 값이 올바르지 않습니다.");
      assert(e >= s, "Day 끝값이 시작값보다 작습니다.");

      inRange = allRows
        .filter(r => r.day >= s && r.day <= e)
        .sort((a,b) => (a.day - b.day));

      assert(inRange.length > 0, "해당 Day 범위에 단어가 없습니다.");

      const set = new Set(inRange.map(r => r.day));
      daysInRange = Array.from(set).sort((a,b)=>a-b);

      meaningShown = false;

      // deck 생성(랜덤 상태 유지)
      rebuildDeck(null);

      $("rangeInfo").textContent = `범위: Day ${s}~${e} / ${inRange.length}개`;
      setupDaySelect();
      renderCurrent();
      enableViewerButtons(true);
      viewerEl.style.display = "block";

      $("shuffleBtn").disabled = false;
      updateShuffleBtn();

      log("범위 적용 완료. 단어를 넘겨보세요.", "good");
    }

    function setupDaySelect() {
      const sel = $("daySelect");
      sel.innerHTML = "";
      for (const d of daysInRange) {
        const opt = document.createElement("option");
        opt.value = String(d);
        opt.textContent = String(d);
        sel.appendChild(opt);
      }
      sel.disabled = daysInRange.length === 0;
      const curDay = deck[currentIndex]?.day;
      if (curDay != null) sel.value = String(curDay);
    }

    function enableViewerButtons(on) {
      const ids = ["firstBtn","prevBtn","toggleBtn","nextBtn","lastBtn","prevDayBtn","nextDayBtn","daySelect"];
      ids.forEach(id => $(id).disabled = !on);
    }

    function updateShuffleBtn() {
      const btn = $("shuffleBtn");
      btn.textContent = shuffleOn ? "랜덤: ON" : "랜덤: OFF";
      btn.classList.toggle("tagOn", shuffleOn);
    }

    function renderCurrent() {
      const item = deck[currentIndex];
      if (!item) return;

      $("wordText").textContent = item.word || "-";
      $("meanText").textContent = item.mean || "";
      $("meanText").style.display = meaningShown ? "block" : "none";
      $("toggleBtn").textContent = meaningShown ? "뜻 숨기기" : "뜻 보기";
      $("hintText").textContent = meaningShown ? "박스를 누르면 뜻이 사라집니다" : "박스를 누르면 뜻이 나타납니다";

      const total = deck.length;
      $("counter").textContent = `Day ${item.day} · ${currentIndex + 1} / ${total}`;

      const sel = $("daySelect");
      if (!sel.disabled) sel.value = String(item.day);

      $("firstBtn").disabled = (currentIndex === 0);
      $("prevBtn").disabled = (currentIndex === 0);
      $("nextBtn").disabled = (currentIndex === total - 1);
      $("lastBtn").disabled = (currentIndex === total - 1);

      const curDay = item.day;
      const dayIdx = daysInRange.indexOf(curDay);
      $("prevDayBtn").disabled = (dayIdx <= 0);
      $("nextDayBtn").disabled = (dayIdx === -1 || dayIdx >= daysInRange.length - 1);
    }

    function goIndex(idx) {
      if (deck.length === 0) return;
      currentIndex = Math.max(0, Math.min(deck.length - 1, idx));
      meaningShown = false;
      renderCurrent();
    }

    function goFirst() { goIndex(0); }
    function goLast()  { goIndex(deck.length - 1); }
    function goPrev()  { goIndex(currentIndex - 1); }
    function goNext()  { goIndex(currentIndex + 1); }

    function toggleMeaning() {
      meaningShown = !meaningShown;
      renderCurrent();
    }

    function goDay(targetDay) {
      const idx = deck.findIndex(r => r.day === targetDay);
      if (idx >= 0) goIndex(idx);
      else {
        // 랜덤 상태에서 targetDay가 중간에 여러 번 나올 수 있는데
        // findIndex는 첫 번째 occurrence로 이동(원하는 동작으로 충분)
      }
    }

    function goPrevDay() {
      const curDay = deck[currentIndex]?.day;
      const i = daysInRange.indexOf(curDay);
      if (i > 0) goDay(daysInRange[i - 1]);
    }

    function goNextDay() {
      const curDay = deck[currentIndex]?.day;
      const i = daysInRange.indexOf(curDay);
      if (i >= 0 && i < daysInRange.length - 1) goDay(daysInRange[i + 1]);
    }

    // ===== 파일 선택 =====
    async function pickExcelAuto() {
      if (supportsFSAccess()) {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: "Excel 파일",
            accept: {
              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"],
              "application/vnd.ms-excel": [".xls"],
              "application/vnd.ms-excel.sheet.macroEnabled.12": [".xlsm"],
            }
          }],
        });
        const file = await handle.getFile();
        return file;
      } else {
        return await new Promise((resolve, reject) => {
          const input = $("fileInput");
          input.value = "";
          input.onchange = () => {
            const f = input.files?.[0];
            if (!f) reject(new Error("파일을 선택하지 않았습니다."));
            else resolve(f);
          };
          input.click();
        });
      }
    }

    // ===== 이벤트 =====
    $("pickBtn").addEventListener("click", async () => {
      try {
        log("엑셀 파일 선택 중…");

        const f = await pickExcelAuto();
        currentFile = f;

        $("fileLabel").textContent = `파일: ${f.name}`;
        $("sheetLabel").textContent = `시트: -`;
        $("countLabel").textContent = `단어: -`;
        $("rangeInfo").textContent = "범위: -";

        viewerEl.style.display = "none";
        enableViewerButtons(false);
        $("applyBtn").disabled = true;
        $("shuffleBtn").disabled = true;

        log("엑셀 읽는 중…");

        const { rows, sheetName } = await readExcel(f);
        assert(rows.length > 0, "유효한 데이터(day/단어/뜻)를 찾지 못했습니다.");

        allRows = rows;
        $("sheetLabel").textContent = `시트: ${sheetName}`;
        $("countLabel").textContent = `단어: ${allRows.length}개`;

        const mm = computeMinMaxDay(allRows);
        assert(mm, "Day 값을 찾지 못했습니다.");
        $("dayStart").value = mm.min;
        $("dayEnd").value = mm.max;

        $("applyBtn").disabled = false;

        log(
          `파일: ${f.name}\n` +
          `시트: ${sheetName}\n` +
          `총 단어: ${allRows.length}개\n` +
          `Day 범위를 확인하고 '범위 적용'을 눌러주세요.`,
          "good"
        );
      } catch (e) {
        console.error(e);
        log(e.message || String(e), "bad");
      }
    });

    $("applyBtn").addEventListener("click", () => {
      try { applyRange(); }
      catch (e) { log(e.message || String(e), "bad"); }
    });

    $("shuffleBtn").addEventListener("click", () => {
      if (!inRange.length) return;
      const cur = deck[currentIndex];
      const keep = cur ? stableKey(cur) : null;

      shuffleOn = !shuffleOn;
      updateShuffleBtn();
      rebuildDeck(keep);

      meaningShown = false;
      setupDaySelect();
      renderCurrent();
    });

    $("firstBtn").addEventListener("click", goFirst);
    $("lastBtn").addEventListener("click", goLast);
    $("prevBtn").addEventListener("click", goPrev);
    $("nextBtn").addEventListener("click", goNext);
    $("toggleBtn").addEventListener("click", toggleMeaning);
    $("prevDayBtn").addEventListener("click", goPrevDay);
    $("nextDayBtn").addEventListener("click", goNextDay);

    $("daySelect").addEventListener("change", (e) => {
      const d = toInt(e.target.value);
      if (d != null) goDay(d);
    });

    // ✅ 단어 박스 클릭으로 뜻 토글
    $("wordBox").addEventListener("click", () => {
      if (viewerEl.style.display === "none") return;
      toggleMeaning();
    });
    // 접근성: 엔터/스페이스로도 토글
    $("wordBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleMeaning();
      }
    });

    // 키보드 조작: 좌우로 넘기기, 스페이스로 뜻 토글
    window.addEventListener("keydown", (e) => {
      if (viewerEl.style.display === "none") return;
      if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
      if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
      if (e.key === " ") {
        // wordBox에 포커스가 있을 때는 위 핸들러가 처리
        if (document.activeElement === $("wordBox")) return;
        e.preventDefault();
        toggleMeaning();
      }
    });

    log("대기 중…");
  </script>
</body>
</html>
